[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskrunner-case-study"
version = "1.0.0"
description = "A production-shaped argparse CLI: the case study for the argparse-mastery repo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Zero runtime dependencies, deliberately: the point of the case study is that
# argparse plus the standard library is enough to ship a real CLI.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
# The console_scripts entry point. Note it points at a *function*, not a module:
# the module would run at import time, the function runs when called.
taskrunner = "taskrunner.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"